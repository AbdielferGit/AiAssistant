<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>AiAssistant</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    margin: 0; background: #0f172a; color: #e2e8f0;
    display: flex; flex-direction: column; height: 100vh;
  }
  header {
    display: flex; justify-content: space-between; align-items: center;
    padding: .9rem 1.25rem; border-bottom: 1px solid #1e293b; flex-shrink: 0;
  }
  header h1 { font-size: 1rem; margin: 0; }
  #logout {
    background: none; border: 1px solid #334155; color: #94a3b8;
    padding: .35rem .75rem; border-radius: 8px; cursor: pointer; font-size: .8rem;
  }
  #chat { flex: 1; overflow-y: auto; padding: 1.25rem; display: flex; flex-direction: column; gap: .75rem; }
  .msg {
    max-width: 70%; padding: .6rem .9rem; border-radius: 14px;
    line-height: 1.4; font-size: .92rem; white-space: pre-wrap;
  }
  .msg.user { align-self: flex-end; background: #2563eb; }
  .msg.assistant { align-self: flex-start; background: #1e293b; }
  .msg.system { align-self: center; background: transparent; color: #64748b; font-size: .8rem; }
  form { display: flex; gap: .6rem; padding: 1rem; border-top: 1px solid #1e293b; flex-shrink: 0; }
  input[type=text] {
    flex: 1; background: #1e293b; border: 1px solid #334155; color: #e2e8f0;
    padding: .7rem 1rem; border-radius: 10px; font-size: .95rem;
  }
  button { background: #2563eb; color: white; border: none; padding: .7rem 1.3rem; border-radius: 10px; cursor: pointer; font-weight: 600; }
  button:disabled { opacity: .5; cursor: default; }
  #modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; align-items: center; justify-content: center; }
  #modal { background: #1e293b; padding: 1.5rem; border-radius: 14px; max-width: 420px; width: 90%; }
  #modal h2 { margin-top: 0; font-size: 1rem; }
  #modal pre { background: #0f172a; padding: .75rem; border-radius: 8px; font-size: .8rem; overflow-x: auto; }
  .modal-actions { display: flex; gap: .6rem; justify-content: flex-end; margin-top: 1rem; }
  .btn-cancel { background: #334155; }
  .btn-confirm { background: #dc2626; }
</style>
</head>
<body>
<header>
  <h1>AiAssistant</h1>
  <button id="logout">Cerrar sesión</button>
</header>
<div id="chat"></div>
<form id="form">
  <input type="text" id="input" placeholder="Escribe un mensaje..." autocomplete="off" required>
  <button type="submit">Enviar</button>
</form>

<div id="modal-backdrop">
  <div id="modal">
    <h2>⚠️ Acción irreversible</h2>
    <p id="modal-tool"></p>
    <pre id="modal-args"></pre>
    <div class="modal-actions">
      <button class="btn-cancel" id="modal-cancel" type="button">Cancelar</button>
      <button class="btn-confirm" id="modal-confirm" type="button">Confirmar</button>
    </div>
  </div>
</div>

<script>
const chatEl = document.getElementById('chat');
const formEl = document.getElementById('form');
const inputEl = document.getElementById('input');
const modalBackdrop = document.getElementById('modal-backdrop');
let pendienteActual = null;

function agregarMensaje(texto, clase) {
  const div = document.createElement('div');
  div.className = 'msg ' + clase;
  div.textContent = texto;
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
  return div;
}

function mostrarPendiente(pendiente) {
  pendienteActual = pendiente;
  document.getElementById('modal-tool').textContent = 'El asistente quiere ejecutar: ' + pendiente.tool;
  document.getElementById('modal-args').textContent = JSON.stringify(pendiente.args, null, 2);
  modalBackdrop.style.display = 'flex';
}

async function manejarRespuesta(data) {
  if (data.texto) agregarMensaje(data.texto, 'assistant');
  if (data.confirmacion_pendiente) mostrarPendiente(data.confirmacion_pendiente);
}

formEl.addEventListener('submit', async (e) => {
  e.preventDefault();
  const mensaje = inputEl.value.trim();
  if (!mensaje) return;
  agregarMensaje(mensaje, 'user');
  inputEl.value = '';
  inputEl.disabled = true;
  try {
    const res = await fetch('/api/chat', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ mensaje }),
    });
    if (res.status === 401) { window.location.href = '/'; return; }
    const data = await res.json();
    await manejarRespuesta(data);
  } catch (err) {
    agregarMensaje('Error de red. Intenta de nuevo.', 'system');
  } finally {
    inputEl.disabled = false;
    inputEl.focus();
  }
});

async function responderConfirmacion(confirmar) {
  modalBackdrop.style.display = 'none';
  if (!pendienteActual) return;
  const res = await fetch('/api/chat/confirmar', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ pendiente_id: pendienteActual.pendiente_id, confirmar }),
  });
  pendienteActual = null;
  if (res.status === 401) { window.location.href = '/'; return; }
  const data = await res.json();
  await manejarRespuesta(data);
}

document.getElementById('modal-confirm').addEventListener('click', () => responderConfirmacion(true));
document.getElementById('modal-cancel').addEventListener('click', () => responderConfirmacion(false));

document.getElementById('logout').addEventListener('click', async () => {
  await fetch('/auth/logout', { method: 'POST' });
  window.location.href = '/';
});
</script>
</body>
</html>
