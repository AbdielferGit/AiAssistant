<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>AiAssistant — Iniciar sesión</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root { color-scheme: dark; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    display: flex; align-items: center; justify-content: center;
    height: 100vh; margin: 0; background: #0f172a; color: #e2e8f0;
  }
  .card {
    background: #1e293b; padding: 2.5rem 3rem; border-radius: 16px;
    text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,.3);
  }
  h1 { font-size: 1.4rem; margin: 0 0 .25rem; }
  p { color: #94a3b8; margin: 0 0 1.5rem; font-size: .9rem; }
  #error { color: #f87171; margin-top: 1rem; font-size: .85rem; min-height: 1.2em; }
</style>
</head>
<body>
  <div class="card">
    <h1>AiAssistant</h1>
    <p>Acceso solo por invitación</p>
    <div id="g_id_onload"
         data-client_id="__GOOGLE_CLIENT_ID__"
         data-callback="onGoogleCredential"
         data-auto_prompt="false">
    </div>
    <div class="g_id_signin" data-type="standard" data-theme="filled_black" data-size="large" data-shape="pill"></div>
    <div id="error"></div>
  </div>
<script>
async function onGoogleCredential(response) {
  const errorEl = document.getElementById('error');
  errorEl.textContent = '';
  try {
    const res = await fetch('/auth/google', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ credential: response.credential }),
    });
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      errorEl.textContent = data.detail || 'No se pudo iniciar sesión.';
      return;
    }
    window.location.href = '/';
  } catch (e) {
    errorEl.textContent = 'Error de red. Intenta de nuevo.';
  }
}
</script>
</body>
</html>
